<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<meta name="mobile-web-app-capable" content="yes">
<title>급식표</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f7d5b'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E🍚%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f3ee; --card:#fff; --text:#1f2421; --muted:#6b726e; --line:#e4e1d9;
    --accent:#2f7d5b; --accent-soft:#e3f1ea; --chip:#f0ede6; --warn:#c2410c; --warn-soft:#fde8dc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141715; --card:#1d211f; --text:#e8ebe9; --muted:#9aa29e; --line:#2c312e;
      --accent:#5cc196; --accent-soft:#1f3329; --chip:#262b28; --warn:#fb923c; --warn-soft:#3a2418; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;
    border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:19px;margin:0;font-weight:700}
  .school{font-size:13px;color:var(--muted);margin-top:2px}
  .quick{display:flex;gap:6px;margin-top:10px}
  .quick button{flex:1;padding:9px 0;font-weight:600}
  .quick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{display:flex;align-items:center;gap:6px;margin-top:10px}
  .nav .range{flex:1;text-align:center;font-size:14px;font-weight:600}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;cursor:pointer}
  button.icon{width:40px;height:40px;padding:0;font-size:18px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px}
  .day.today{border:2px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--card) 60px)}
  .dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .dname{font-weight:700;font-size:16px}
  .dname small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
  .badge{font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .kcal{font-size:12px;color:var(--muted)}
  ul{list-style:none;margin:0;padding:0}
  li{padding:5px 0;font-size:16px;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  li.hit{color:var(--warn);font-weight:600}
  .al{font-size:11px;color:var(--muted);background:var(--chip);border-radius:6px;padding:1px 6px}
  li.hit .al{background:var(--warn-soft);color:var(--warn)}
  .empty{color:var(--muted);font-size:14px}
  .msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .err{color:var(--warn)}
  /* settings */
  dialog{border:none;border-radius:16px;padding:0;width:min(92vw,480px);background:var(--card);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .sheet{padding:18px}
  .sheet h2{font-size:17px;margin:0 0 14px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=password]{width:100%;font:inherit;color:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .results{margin-top:8px;max-height:200px;overflow:auto}
  .results button{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:14px}
  .results small{color:var(--muted);display:block;font-size:12px}
  .alg{display:flex;flex-wrap:wrap;gap:6px}
  .alg label{margin:0;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text);
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .switch{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>급식표</h1>
      <div class="school" id="schoolName">학교를 설정해 주세요</div>
    </div>
    <button class="icon" id="btnSettings" aria-label="설정">⚙︎</button>
  </div>
  <div class="quick" id="quick"></div>
  <div class="nav">
    <button class="icon" id="prev" aria-label="이전 주">‹</button>
    <div class="range" id="range"></div>
    <button class="icon" id="next" aria-label="다음 주">›</button>
    <button id="todayBtn">오늘</button>
  </div>
</header>

<main id="list"><div class="msg">불러오는 중…</div></main>

<dialog id="dlg">
  <div class="sheet" id="settingsForm">
    <h2>설정</h2>

    <label for="q">학교 검색</label>
    <div class="row">
      <input type="text" id="q" placeholder="예: 광명초등학교">
      <button type="button" id="searchBtn">검색</button>
    </div>
    <div class="results" id="results"></div>
    <div class="hint" id="curSchool"></div>

    <label>표시할 알레르기 (해당 메뉴를 강조)</label>
    <div class="alg" id="alg"></div>

    <div class="switch"><input type="checkbox" id="showNums"><span>메뉴 옆 알레르기 표시</span></div>

    <div class="actions">
      <button type="button" id="closeBtn">닫기</button>
      <button type="button" class="primary" id="saveBtn">저장</button>
    </div>
  </div>
</dialog>

<script>
// ===== 설정 =====
// [운영] Cloudflare Worker 주소를 넣으면 키 없이 Worker를 거쳐 호출해요. 예: 'https://neis-meal.내계정.workers.dev/'
const PROXY_URL = '';
// [테스트] PROXY_URL이 비어 있으면 NEIS를 직접 호출해요. 테스트할 때만 여기에 키를 넣으세요.
const API_KEY = '여기에_인증키';
// ================
const USE_PROXY = !!PROXY_URL;
const HAS_KEY = USE_PROXY || (API_KEY && !API_KEY.startsWith('여기에'));
const API = USE_PROXY ? PROXY_URL.replace(/\/?$/,'/') : 'https://open.neis.go.kr/hub/';
const ALLERGENS = ['','난류','우유','메밀','땅콩','대두','밀','고등어','게','새우','돼지고기','복숭아','토마토','아황산류','호두','닭고기','쇠고기','오징어','조개류','잣'];
const QUICK = [
  {office:'J10', code:'7591017', name:'광명초등학교', short:'광명초', addr:'경기도 광명시 광이로 21'},
  {office:'J10', code:'7591024', name:'도덕초등학교', short:'도덕초', addr:'경기도 광명시 가마산로 28'},
];
const DAYS = ['일','월','화','수','목','금','토'];

const store = {
  get(k, d){ try{ const v = localStorage.getItem('meal.'+k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('meal.'+k, JSON.stringify(v)); }catch(e){} }
};

let cfg = {
  school: store.get('school', {office:'J10', code:'7591017', name:'광명초등학교', addr:'경기도 광명시 광이로 21'}),
  watch: store.get('watch', []),
  showNums: store.get('showNums', true)
};

let weekStart = mondayOf(new Date());

function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = x.getDay(); x.setDate(x.getDate() - (w===0?6:w-1)); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function md(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// "돼지고기두루치기 (5.6.10.13.18)" → {name, nums:[5,6,10,13,18]}
function parseDish(raw){
  const s = raw.replace(/&amp;/g,'&').trim();
  const m = s.match(/^(.*?)\s*\(([\d.\s]+)\)\s*$/);
  if(!m) return {name:s, nums:[]};
  return {name:m[1].trim(), nums:m[2].split('.').map(n=>parseInt(n,10)).filter(n=>n>0 && n<ALLERGENS.length)};
}

async function fetchWeek(start){
  const from = ymd(start), to = ymd(addDays(start,6));
  const cacheKey = 'w.'+cfg.school.code+'.'+from;
  const p = new URLSearchParams({Type:'json', pIndex:1, pSize:100,
    ATPT_OFCDC_SC_CODE:cfg.school.office, SD_SCHUL_CODE:cfg.school.code,
    MLSV_FROM_YMD:from, MLSV_TO_YMD:to});
  if(!USE_PROXY && HAS_KEY) p.set('KEY', API_KEY);
  try{
    const r = await fetch(API+'mealServiceDietInfo?'+p);
    const j = await r.json();
    let rows = [];
    if(j.mealServiceDietInfo){
      rows = j.mealServiceDietInfo[1].row || [];
    }else if(j.RESULT && j.RESULT.CODE !== 'INFO-200'){
      throw new Error(j.RESULT.MESSAGE || j.RESULT.CODE);
    }
    store.set(cacheKey, rows);
    return {rows, cached:false};
  }catch(e){
    const c = store.get(cacheKey, null);
    if(c) return {rows:c, cached:true};
    throw e;
  }
}

async function render(){
  document.getElementById('schoolName').textContent = cfg.school.name;
  document.getElementById('quick').innerHTML = QUICK.map((q,i)=>
    `<button type="button" data-i="${i}" class="${q.code===cfg.school.code?'on':''}">${q.short}</button>`).join('');
  const end = addDays(weekStart,4);
  document.getElementById('range').textContent = md(weekStart)+' – '+md(end);
  const list = document.getElementById('list');
  list.innerHTML = '<div class="msg">불러오는 중…</div>';

  let res;
  try{ res = await fetchWeek(weekStart); }
  catch(e){ list.innerHTML = '<div class="msg err">불러오지 못했어요<br><small>'+esc(String(e.message||e))+'</small></div>'; return; }

  const byDay = {};
  for(const r of res.rows){ (byDay[r.MLSV_YMD] ||= []).push(r); }
  const todayStr = ymd(new Date());
  let html = '';
  if(res.cached) html += '<div class="msg" style="padding:4px 0 10px">오프라인 · 저장된 식단을 보여줘요</div>';

  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i), key = ymd(d);
    const meals = (byDay[key]||[]).sort((a,b)=>a.MMEAL_SC_CODE-b.MMEAL_SC_CODE);
    if((i>=5) && !meals.length) continue; // 주말은 급식 있을 때만
    const isToday = key===todayStr;
    html += `<section class="day${isToday?' today':''}" ${isToday?'id="todayCard"':''}>`;
    html += `<div class="dh"><div class="dname">${DAYS[d.getDay()]}요일<small>${md(d)}</small>${isToday?'<span class="badge">오늘</span>':''}</div>`;
    if(meals.length===1) html += `<div class="kcal">${esc(meals[0].CAL_INFO||'')}</div>`;
    html += '</div>';
    if(!meals.length){ html += '<div class="empty">급식 없음</div>'; }
    for(const m of meals){
      if(meals.length>1) html += `<div class="kcal" style="margin:6px 0 2px">${esc(m.MMEAL_SC_NM)} · ${esc(m.CAL_INFO||'')}</div>`;
      html += '<ul>';
      for(const raw of m.DDISH_NM.split(/<br\s*\/?>/i)){
        if(!raw.trim()) continue;
        const dish = parseDish(raw);
        const hit = dish.nums.some(n=>cfg.watch.includes(n));
        html += `<li class="${hit?'hit':''}"><span>${esc(dish.name)}</span>`;
        if(cfg.showNums && dish.nums.length){
          const shown = cfg.watch.length ? dish.nums.filter(n=>cfg.watch.includes(n)) : dish.nums;
          if(shown.length) html += `<span class="al">${shown.map(n=>ALLERGENS[n]).join(' · ')}</span>`;
        }
        html += '</li>';
      }
      html += '</ul>';
    }
    html += '</section>';
  }
  list.innerHTML = html || '<div class="msg">이번 주 식단이 아직 없어요</div>';
  const t = document.getElementById('todayCard');
  if(t) t.scrollIntoView({block:'center'});
}

// ---- 설정 ----
const dlg = document.getElementById('dlg');
let pendingSchool = null;

function openSettings(){
  document.getElementById('showNums').checked = cfg.showNums;
  document.getElementById('results').innerHTML = '';
  pendingSchool = cfg.school;
  document.getElementById('curSchool').textContent = '현재: '+cfg.school.name+' ('+(cfg.school.addr||'')+')';
  const alg = document.getElementById('alg');
  alg.innerHTML = ALLERGENS.slice(1).map((n,i)=>`<label><input type="checkbox" value="${i+1}" ${cfg.watch.includes(i+1)?'checked':''}>${n}</label>`).join('');
  try{ dlg.showModal(); }catch(e){ dlg.setAttribute('open',''); }
}

async function searchSchool(){
  const q = document.getElementById('q').value.trim();
  const box = document.getElementById('results');
  if(!q) return;
  box.innerHTML = '<div class="hint">검색 중…</div>';
  const p = new URLSearchParams({Type:'json', pIndex:1, pSize:30, SCHUL_NM:q});
  if(!USE_PROXY && HAS_KEY) p.set('KEY', API_KEY);
  try{
    const j = await (await fetch(API+'schoolInfo?'+p)).json();
    const rows = j.schoolInfo ? j.schoolInfo[1].row : [];
    if(!rows.length){ box.innerHTML = '<div class="hint">검색 결과가 없어요</div>'; return; }
    box.innerHTML = '';
    rows.forEach(r=>{
      const b = document.createElement('button'); b.type='button';
      b.innerHTML = esc(r.SCHUL_NM)+'<small>'+esc(r.ORG_RDNMA||r.LCTN_SC_NM||'')+'</small>';
      b.onclick = ()=>{
        pendingSchool = {office:r.ATPT_OFCDC_SC_CODE, code:r.SD_SCHUL_CODE, name:r.SCHUL_NM, addr:r.ORG_RDNMA||''};
        document.getElementById('curSchool').textContent = '선택: '+pendingSchool.name+' ('+pendingSchool.addr+')';
        box.innerHTML = '';
      };
      box.appendChild(b);
    });
  }catch(e){ box.innerHTML = '<div class="hint err">검색 실패: '+esc(String(e.message||e))+'<br>주소가 https:// 로 시작하는 곳에서 열었는지 확인해 주세요. (현재: '+esc(location.protocol)+')</div>'; }
}

function closeDlg(){ try{ dlg.close(); }catch(e){ dlg.removeAttribute('open'); } }
document.getElementById('closeBtn').onclick = closeDlg;
document.getElementById('saveBtn').onclick = ()=>{
  {
    cfg.school = pendingSchool || cfg.school;
    cfg.showNums = document.getElementById('showNums').checked;
    cfg.watch = [...document.querySelectorAll('#alg input:checked')].map(x=>+x.value);
    store.set('school',cfg.school); store.set('watch',cfg.watch); store.set('showNums',cfg.showNums);
    closeDlg();
    render();
  }
};
document.getElementById('quick').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const q = QUICK[+b.dataset.i]; if(q.code===cfg.school.code) return;
  cfg.school = {office:q.office, code:q.code, name:q.name, addr:q.addr};
  store.set('school', cfg.school);
  render();
});
document.getElementById('searchBtn').onclick = searchSchool;
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); searchSchool(); }});
document.getElementById('btnSettings').onclick = openSettings;
document.getElementById('prev').onclick = ()=>{ weekStart = addDays(weekStart,-7); render(); };
document.getElementById('next').onclick = ()=>{ weekStart = addDays(weekStart,7); render(); };
function thisWeek(){ const w = new Date().getDay(); return addDays(mondayOf(new Date()), (w===6||w===0)?7:0); }
document.getElementById('todayBtn').onclick = ()=>{ weekStart = thisWeek(); render(); };

// 주말에 열면 다음 주를 보여줌
weekStart = thisWeek();
render();
</script>
</body>
</html>
